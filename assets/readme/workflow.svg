<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">How ai-harness-skills works</title>
  <desc id="desc">Four stages: declare upstreams in a pack's manifest.toml; aihs sync caches them and pins commits in aihs.lock; aihs create-plugin pins every entry to its locked commit and validates; Claude Code installs a pack as one stack.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#46c2a8"/>
    </marker>
  </defs>

  <rect width="1200" height="300" rx="20" fill="#0f1419"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g fill="#161d24" stroke="#2b3640" stroke-width="2">
      <rect x="40" y="48" width="262" height="204" rx="12"/>
      <rect x="326" y="48" width="262" height="204" rx="12"/>
      <rect x="612" y="48" width="262" height="204" rx="12"/>
      <rect x="898" y="48" width="262" height="204" rx="12"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#93a1ad">
      <text x="62" y="88">01</text>
      <text x="348" y="88">02</text>
      <text x="634" y="88">03</text>
      <text x="920" y="88">04</text>
    </g>

    <g font-size="24" font-weight="700" fill="#e9eef2">
      <text x="62" y="126">Declare</text>
      <text x="348" y="126">Sync</text>
      <text x="634" y="126">Publish</text>
      <text x="920" y="126">Install</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#46c2a8">
      <text x="62" y="160">manifest.toml</text>
      <text x="348" y="160">aihs sync</text>
      <text x="634" y="160">aihs create-plugin</text>
      <text x="920" y="160">/plugin install</text>
    </g>

    <g font-size="20" fill="#93a1ad">
      <text x="62" y="198">repos, paths, skills</text>
      <text x="62" y="226">— no copies</text>
      <text x="348" y="198">cache + aihs.lock</text>
      <text x="348" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#f0b44c">@143a3d9</text>
      <text x="634" y="198">pin to commits,</text>
      <text x="634" y="226">validate</text>
      <text x="920" y="198">a pack = one stack</text>
      <text x="920" y="226">of plugins</text>
    </g>

    <g stroke="#46c2a8" stroke-width="2" marker-end="url(#arrow)">
      <line x1="304" y1="150" x2="318" y2="150"/>
      <line x1="590" y1="150" x2="604" y2="150"/>
      <line x1="876" y1="150" x2="890" y2="150"/>
    </g>
  </g>
</svg>
