<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ipm in a terminal</title>
  <desc id="desc">Abbreviated real output: ipm sync reports 19 upstreams pinned; ipm create-plugin writes a 98-plugin marketplace, all referenced upstream at locked commits, that passes claude plugin validate; installing the code-core stack pulls in 23 dependencies.</desc>

  <rect width="1200" height="560" rx="20" fill="#0f1419"/>
  <rect x="0" y="0" width="1200" height="48" rx="20" fill="#161d24"/>
  <rect x="0" y="28" width="1200" height="20" fill="#161d24"/>
  <g fill="#2b3640">
    <circle cx="32" cy="24" r="7"/>
    <circle cx="56" cy="24" r="7"/>
    <circle cx="80" cy="24" r="7"/>
  </g>
  <text x="600" y="31" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#93a1ad">ai-harness-skills — abbreviated, real output</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" xml:space="preserve">
    <text x="40" y="96"><tspan fill="#93a1ad">$ </tspan><tspan fill="#e9eef2">ipm sync</tspan></text>
    <text x="40" y="126" fill="#e9eef2"><tspan fill="#46c2a8">✓</tspan> anthropics/skills        <tspan fill="#f0b44c">683bc88</tspan>  cached</text>
    <text x="40" y="156" fill="#e9eef2"><tspan fill="#46c2a8">✓</tspan> github/awesome-copilot   <tspan fill="#f0b44c">143a3d9</tspan>  cached</text>
    <text x="40" y="186" fill="#93a1ad">  ⋮</text>
    <text x="40" y="216" fill="#e9eef2">19 upstream(s): 0 fetched, 0 moved, 0 failed — aihs.lock</text>

    <text x="40" y="270"><tspan fill="#93a1ad">$ </tspan><tspan fill="#e9eef2">ipm create-plugin</tspan></text>
    <text x="40" y="300" fill="#e9eef2">wrote .claude-plugin/marketplace.json</text>
    <text x="40" y="330" fill="#e9eef2">marketplace "ai-harness-skills-marketplace" — <tspan fill="#46c2a8">98 plugins</tspan>,</text>
    <text x="40" y="360" fill="#e9eef2">  all referenced upstream at locked commits, nothing copied</text>
    <text x="40" y="390" fill="#e9eef2">claude plugin validate: <tspan fill="#46c2a8">ok</tspan></text>

    <text x="40" y="444"><tspan fill="#93a1ad">$ </tspan><tspan fill="#e9eef2">claude plugin install code-core@ai-harness-skills-marketplace</tspan></text>
    <text x="40" y="474" fill="#e9eef2"><tspan fill="#46c2a8">✔</tspan> Successfully installed plugin: code-core@ai-harness-skills-marketplace</text>
    <text x="40" y="504" fill="#e9eef2">  (scope: user) <tspan fill="#46c2a8">(+ 23 dependencies:</tspan> user-core, doublecheck,</text>
    <text x="40" y="534" fill="#e9eef2">  context-engineering, public-agent-skills, find-skills, …)</text>
  </g>
</svg>
