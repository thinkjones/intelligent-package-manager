# Repos of interest: upstream repos worth watching for Claude Code plugins,
# Copilot plugins, marketplaces, and skills, hooks and agents folders. This
# root manifest publishes nothing.
#
#   ipm sync    pins every repo here in aihs.lock and caches it
#   ipm index   catalogs every artifact they hold into catalog/
#   ipm scan    reports the plugin, skills, hooks and agents folders each holds
#
# [[repo]]
#   repo     GitHub owner/repo, or a full git URL
#   version  tag, branch or commit, npm style; omit for the latest default branch
#
# Seeded from the upstreams the former packs referenced, most used first.

